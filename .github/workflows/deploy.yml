name: Deploy

on:
  push:
    branches:
      - 'master'

# Deploys must not overlap. The production box is a single 1GB instance, and a
# batch of merges (several Dependabot PRs at once) previously started concurrent
# deploys that exhausted its memory and wedged the machine.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: 13.42.142.195
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run coverage

      # Compile here rather than on the server: tsc needs ~370MB and the box has
      # other things to do with its 2GB. Only the emitted JavaScript is shipped.
      # node_modules is never shipped -- this runner is x86_64 and the server is
      # arm64 (Graviton), so native modules must be built where they will run.
      - run: npm run prepublishOnly

      # Prune to what the server will have and check the build still loads. A
      # runtime import of a devDependency resolves fine here until this point,
      # then fails on boot in production.
      - run: npm install --omit=dev --no-audit --no-fund
      - run: npm run verify-runtime-deps

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_PRIVATE_KEY" > ./deploy.key
          sudo chmod 600 ./deploy.key
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{secrets.SSH_PRIVATE_KEY}}
          SSH_KNOWN_HOSTS: ${{secrets.SSH_KNOWN_HOSTS}}

      - name: Upload the build
        run: |
          rsync -az --delete \
            -e "ssh -i ./deploy.key -o StrictHostKeyChecking=no" \
            ./dist/ "ubuntu@$DEPLOY_HOST:/home/ubuntu/eco-rewards-hub/incoming-dist/"

      - run: npm install pm2 -g
      - run: pm2 deploy ecosystem.config.js production update
